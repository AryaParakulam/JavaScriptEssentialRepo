<!DOCTYPE html>
<html>
<head>
  <title>Weather Report</title>
</head>
<body>
   <h1>Weather Report</h1>

  <form id="weatherForm">
    <label for="city">Enter City:</label>
    <input type="text" id="city" name="city">
    <button type="submit">Get Weather</button><br><br>
    <label for="latitude">Enter Latitude:</label>
    <input type="text" id="latitude"><br>
    <label for="longitude">Enter Latitude:</label>
    <input type="text" id="longitude"><br>
    <button id="subCoord">Get weather using coordinates</button>
  </form>

  <div id="weatherInfo"></div>
<script src="./weather_update.js"></script>
</body>
</html>
